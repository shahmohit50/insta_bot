name: Telegram Insta Bot

permissions:
  contents: write
  
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install deps
        run: pip install requests yt-dlp

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Commit state safely
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@example.com"
          git add state.json processed.json || true
          git commit -m "update bot state" || echo "no changes"
          git pull --rebase
          git push
